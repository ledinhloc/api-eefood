services:
  chroma:
    image: chromadb/chroma:0.4.24
    container_name: chroma
    ports:
      - "8010:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
#    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=elastic123
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    mem_limit: 1g
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - microservices-net
    healthcheck:
      test: curl -u elastic:elastic123 -f http://localhost:9200 || exit 1
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=kibana123
    ports:
      - "5601:5601"
    networks:
      - microservices-net

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    environment:
      # Port
      LIVEKIT_PORT: "7880"

      # RTC Configuration - IP máy thật
      LIVEKIT_RTC_NODE_IP: "192.168.1.8" #172.16.1.202
      LIVEKIT_RTC_ANNOUNCE_IP: "192.168.1.8"

      # Port range cho RTC (UDP)
      LIVEKIT_RTC_PORT_RANGE_START: "50100"
      LIVEKIT_RTC_PORT_RANGE_END: "50119"

      # ICE Configuration
      LIVEKIT_RTC_USE_ICE_LITE: "false"

      # API keys
      LIVEKIT_KEYS: "devkey: secret"

      # Room settings
      LIVEKIT_ROOM_AUTO_CREATE: "true"
    mem_limit: 512m
    ports:
      - "7880:7880"                    # WebSocket
      - "50100-50119:50100-50119/udp"  # RTC ports

#    restart: unless-stopped
    networks:
      - microservices-net


  postgresql:
    container_name: pg_sql
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /data/postgres
    mem_limit: 512m
    volumes:
      - postgres:/data/postgres
#      - ./init-multiple-db.sh:/docker-entrypoint-initdb.d/init-multiple-db.sh
    ports:
      - "5435:5432"
    networks:
      - microservices-net
#    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    mem_limit: 512m
    ports:
      - "22181:2181"
    networks:
      - microservices-net
    healthcheck:
      test: echo srvr | nc localhost 2181 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.3
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:29092,PLAINTEXT_C://0.0.0.0:9093,PLAINTEXT_L://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_L://localhost:9092,PLAINTEXT_C://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_L:PLAINTEXT,PLAINTEXT_C:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 1g
    networks:
      - microservices-net
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1
      interval: 10s
      timeout: 10s
      retries: 5

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema_registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8086:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: http://schema-registry:8081
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms256m -Xmx256m"
    mem_limit: 512m
    networks:
      - microservices-net
    healthcheck:
      test: curl -f http://localhost:8081/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    depends_on:
      - kafka
    ports:
      - "9010:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=kafka
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9093
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
      - KAFKA_CLUSTERS_0_SCHEMAREGISTRY=http://schema-registry:8081
      - JAVA_OPTS=-Xms128m -Xmx256m
    mem_limit: 512m
#    restart: always
    networks:
      - microservices-net

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.3.1
    ports:
      - 9098:9098
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: pg_sql
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres

      KC_HTTP_PORT: 9098
#      KC_HOSTNAME: keycloak
      KC_PROXY: "edge"
#      KC_HOSTNAME_STRICT: false
#      KC_HOSTNAME_STRICT_HTTPS: false
#      KEYCLOAK_FRONTEND_URL: http://localhost:9098/
      KC_HOSTNAME_URL: http://localhost:9098
      KC_HOSTNAME_ADMIN_URL: http://localhost:9098
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m"
    mem_limit: 512m
    networks:
      - microservices-net
    command:
      - "start-dev"

  redis:
    image: redis:latest
    container_name: redis-server
    mem_limit: 256m
#    restart: always
    ports:
      - "6379:6379"
    #    command: [ "redis-server", "--requirepass", "12345678" ]
    networks:
      - microservices-net

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redis-ui
    mem_limit: 512m
#    restart: always
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - microservices-net

