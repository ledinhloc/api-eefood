version: '3.8'

services:
  chroma:
    image: chromadb/chroma:0.4.24
    container_name: chroma
    ports:
      - "8010:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    mem_limit: 512m
    mem_reservation: 256m
    networks:
      - microservices-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=elastic123
      - ES_JAVA_OPTS=-Xms256m -Xmx256m # Giảm RAM giống file 2
    mem_limit: 1g
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - microservices-net
    healthcheck:
      test: curl -u elastic:elastic123 -f http://localhost:9200 || exit 1
      interval: 30s
      timeout: 10s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    environment:
      LIVEKIT_PORT: "7880"

      LIVEKIT_RTC_NODE_IP: "103.82.24.53"
      LIVEKIT_RTC_ANNOUNCE_IP: "103.82.24.53"

      LIVEKIT_RTC_PORT_RANGE_START: "50100"
      LIVEKIT_RTC_PORT_RANGE_END: "50119"

      LIVEKIT_RTC_USE_ICE_LITE: "false"
      LIVEKIT_KEYS: "devkey: secret"
      LIVEKIT_ROOM_AUTO_CREATE: "true"
    mem_limit: 512m
    ports:
      - "7880:7880"
      - "50100-50119:50100-50119/udp"
    networks:
      - microservices-net

  postgresql:
    container_name: pg_sql
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /data/postgres
    mem_limit: 512m
    volumes:
      - postgres:/data/postgres
      # - ./init-multiple-db.sh:/docker-entrypoint-initdb.d/init-multiple-db.sh
    ports:
      - "5435:5432"
    networks:
      - microservices-net
    # restart: unless-stopped # Bỏ giống file 2

  kafka:
    image: confluentinc/cp-kafka:7.4.3
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:29092,PLAINTEXT_C://0.0.0.0:9093,PLAINTEXT_L://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_L://localhost:9092,PLAINTEXT_C://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_L:PLAINTEXT,PLAINTEXT_C:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    mem_limit: 1g
    networks:
      - microservices-net
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1
      interval: 10s
      timeout: 10s
      retries: 5

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema_registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8086:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: http://schema-registry:8081
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms256m -Xmx256m"
    mem_limit: 512m
    networks:
      - microservices-net
    healthcheck:
      test: curl -f http://localhost:8081/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.3.1
    ports:
      - "9098:9098"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_URL_HOST: pg_sql
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres

      KC_HTTP_PORT: 9098
      KC_PROXY: "edge"

      KC_HOSTNAME_URL: http://localhost:9098
      KC_HOSTNAME_ADMIN_URL: http://localhost:9098

      # Giới hạn Java heap giống file 2
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m"
    mem_limit: 512m
    networks:
      - microservices-net
    command:
      - "start-dev"

  redis:
    image: redis:latest
    container_name: redis-server
    mem_limit: 256m
    # restart: always # Bỏ giống file 2
    ports:
      - "6379:6379"
    # command: [ "redis-server", "--requirepass", "12345678" ]
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  postgres:
  pgadmin:
  elasticsearch-data:
  chroma_data: