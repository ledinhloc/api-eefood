name: CI/CD Deploy to VPS

on:
  push:
    branches: [ "deloy" ]

jobs:
  changes:
    runs-on: ubuntu-latest
    # Đầu ra (outputs) để các job sau biết service nào cần build
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          #  Nếu code trong folder services/name thay đổi -> build name
          filters: |
            config-service: 'services/config-service/**'
            discovery: 'services/discovery/**'
            gateway: 'services/gateway/**'
            iam-service: 'services/iam-service/**'
            notification-service: 'services/notification-service/**'
            reaction-service: 'services/reaction-service/**'
            recipe-service: 'services/recipe-service/**'

  build-and-push:
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' && needs.changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Chạy matrix dựa trên danh sách các service thực sự thay đổi
        service: ${{ fromJson(needs.changes.outputs.services) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR for ${{ matrix.service }}
        run: |
          cd services/${{ matrix.service }}
          mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ledinhloc/${{ matrix.service }}:latest

  deploy:
    needs: [changes, build-and-push]
    # Job deploy luôn chạy nếu có bất kỳ service nào thay đổi
    if: ${{ always() && needs.changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/eefood
            docker compose -f docker-compose.app.yml pull
            docker compose -f docker-compose.app.yml up -d