spring:
  cloud:
    gateway:
      discovery:
        locator:
          enable: true
      server:
        webflux:
          routes:
            - id: keycloak
              uri: http://localhost:9098
              predicates:
                - Path=/auth/**
              filters:
                - RewritePath=/auth/(?<segment>.*), /$\{segment}
            - id: reaction-service
              uri: lb://REACTION-SERVICE
              predicates:
                - Path=/api/v1/reaction/**
            - id: iam-service
              uri: lb://IAM-SERVICE
              predicates:
                - Path=/api/v1/users/**
            - id: recipe-service
              uri: lb://RECIPE-SERVICE
              predicates:
                - Path=/api/v1/recipe/**
            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/v1/notification/**
    bus:
      enabled: true
    stream:
      kafka:
        binder:
          brokers: ${env.global.kafka.brokers}
      bindings:
        springCloudBusInput:
          destination: springCloudBus
        springCloudBusOutput:
          destination: springCloudBus
logging:
  level:
    org.springframework.cloud.gateway: DEBUG

server:
  port: 8222

management:
  endpoints:
    web:
      exposure:
        include:
          - refresh       # Cho phép gọi /actuator/refresh để nạp lại cấu hình (dùng với Spring Cloud Config)
          - health        # Cho phép truy cập endpoint /actuator/health để kiểm tra tình trạng ứng dụng
          - info          # Cho phép truy cập /actuator/info để xem thông tin ứng dụng
          - metrics       # Cho phép truy cập /actuator/metrics để xem tất cả metric hiện có
          - prometheus    # Cho phép Prometheus scrape metrics tại /actuator/prometheus

  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  observations:
    key-values:
      application: gateway-service # Gắn nhãn `application=gateway-service` vào tất cả metric
