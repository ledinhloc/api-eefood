spring:
  application:
    name: config-service
  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          search-locations: classpath:/configuration

    discovery:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${env.discovery.eureka.client.service-url.defaultZone:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

server:
  port: 8888
