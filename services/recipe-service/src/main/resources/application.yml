server:
  port: 8100
  servlet:
    context-path: /
    session:
      cookie:
        same-site: strict
        http-only: true

elasticsearch:
  host: ${ES_HOST:localhost}
  port: ${ES_PORT:9200}
  username: ${ES_USERNAME:elastic}
  password: ${ES_PASSWORD:elastic123}

spring:
  application:
    name: recipe-service
  config:
    import: optional:configserver:http://localhost:8888

  #  kafka
  kafka:
    bootstrap-servers: ${env.global.kafka.brokers:localhost:9092}
    properties:
      schema.registry.url: ${env.global.schema.registry.url:http://localhost:8086}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        specific.avro.reader: true


  datasource:
    url: ${env.iam.datasource.url:jdbc:postgresql://localhost:5435/recipe_service}
    username: ${env.iam.datasource.username:postgres}
    password: ${env.iam.datasource.password:postgres}
    hikari:
      connection-timeout: 5000       # Timeout khi lấy connection (5s)
      validation-timeout: 3000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        envers:
          audit_table_suffix: _aud
          store_data_at_delete: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

management:
  health:
    elasticsearch:
      enabled: false
  endpoints:
    web:
      exposure:
        include:
          - refresh       # Cho phép gọi /actuator/refresh để nạp lại cấu hình (dùng với Spring Cloud Config)
          - health        # Cho phép truy cập endpoint /actuator/health để kiểm tra tình trạng ứng dụng
          - info          # Cho phép truy cập /actuator/info để xem thông tin ứng dụng
          - metrics       # Cho phép truy cập /actuator/metrics để xem tất cả metric hiện có
          - prometheus    # Cho phép Prometheus scrape metrics tại /actuator/prometheus

  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

  observations:
    key-values:
      application: iam-service # Gắn nhãn `application=iam-service` vào tất cả metric

logging:
  level:
    root: INFO
    # Log feign chi tiết
    feign: DEBUG
    feign.client: DEBUG

google:
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY}
      model: gemini-2.5-flash
      temperature: 0.1
      log-requests: true
      log-responses: true

LANGSMITH_TRACING: "true"
LANGSMITH_ENDPOINT: "https://api.smith.langchain.com"
LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
LANGSMITH_PROJECT: recipe-service








