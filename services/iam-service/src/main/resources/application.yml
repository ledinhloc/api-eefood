server:
  port: 8085
  servlet:
    context-path: /
    session:
      cookie:
        same-site: strict
        http-only: true

spring:
#  redis
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379

  application:
    name: iam-service
  config:
    import: optional:configserver:http://localhost:8888

#  kafka
  kafka:
    bootstrap-servers: localhost:9092
    properties:
      schema.registry.url: http://localhost:8086
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer

  datasource:
    url: ${env.iam.datasource.url:jdbc:postgresql://localhost:5435/iam_service}
    username: ${env.iam.datasource.username:postgres}
    password: ${env.iam.datasource.password:postgres}
    hikari:
      connection-timeout: 5000       # Timeout khi lấy connection (5s)
      validation-timeout: 3000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        envers:
          audit_table_suffix: _aud
          store_data_at_delete: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include:
          - refresh       # Cho phép gọi /actuator/refresh để nạp lại cấu hình (dùng với Spring Cloud Config)
          - health        # Cho phép truy cập endpoint /actuator/health để kiểm tra tình trạng ứng dụng
          - info          # Cho phép truy cập /actuator/info để xem thông tin ứng dụng
          - metrics       # Cho phép truy cập /actuator/metrics để xem tất cả metric hiện có
          - prometheus    # Cho phép Prometheus scrape metrics tại /actuator/prometheus

  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

  observations:
    key-values:
      application: iam-service # Gắn nhãn `application=iam-service` vào tất cả metric

logging:
  level:
    root: INFO
    # Log feign chi tiết
    feign: DEBUG
    feign.client: DEBUG
    org.springframework.security: DEBUG
google:
  client_id: ${GOOGLE_CLIENT_ID}












