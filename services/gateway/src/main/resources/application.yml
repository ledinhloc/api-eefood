spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:${env.global.config-server:http://localhost:8888}

  cloud:
    gateway:
      discovery:
        locator:
          enable: true
      server:
        webflux:
          routes:
            - id: keycloak
              uri: ${env.global.keycloak.base-url:http://localhost:9098}
              predicates:
                - Path=/auth/**
              filters:
                - RewritePath=/auth/(?<segment>.*), /$\{segment}
            - id: iam-service
              uri: lb://IAM-SERVICE
              predicates:
                - Path=/api/v1/users/**
            - id: iam-service
              uri: lb://IAM-SERVICE
              predicates:
                - Path=/api/v1/auth/**
            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/v1/notification/**
            - id: notification-websocket
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/ws/**

            - id: recipe-service
              uri: lb://RECIPE-SERVICE
              predicates:
                - Path=/api/v1/recipes/**
            - id: recipe-service
              uri: lb://RECIPE-SERVICE
              predicates:
                - Path=/api/v1/ingredients/**
            - id: recipe-service
              uri: lb://RECIPE-SERVICE
              predicates:
                - Path=/api/v1/categories/**
            - id: recipe-service
              uri: lb://RECIPE-SERVICE
              predicates:
                - Path=/api/v1/shopping/**
            - id: post-reaction-service
              uri: lb://REACTION-SERVICE
              predicates:
                - Path=/api/v1/post-views/**
            - id: recipe-service
              uri: lb://RECIPE-SERVICE
              predicates:
                - Path=/api/v1/shopping/**
            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/v1/notifications/**
            - id: post-reaction-service
              uri: lb://REACTION-SERVICE
              predicates:
                - Path=/api/v1/posts/**
            - id: post-reaction-service
              uri: lb://REACTION-SERVICE
              predicates:
                - Path=/api/v1/post-reactions/**
            - id: post-comment-service
              uri: lb://REACTION-SERVICE
              predicates:
                - Path=/api/v1/comments/**
            - id: post-collection
              uri: lb://REACTION-SERVICE
              predicates:
                - Path=/api/v1/collections/**
            - id: comment-reaction-service
              uri: lb://REACTION-SERVICE
              predicates:
                - Path=/api/v1/comment-reactions/**
            - id: comment-share-service
              uri: lb://REACTION-SERVICE
              predicates:
                - Path=/api/v1/shares/**
            - id: follow-user-service
              uri: lb://REACTION-SERVICE
              predicates:
                - Path=/api/v1/follows/**
            - id: admin-post-service
              uri: lb://REACTION-SERVICE
              predicates:
                - Path=/api/v1/admin/**
            - id: story-service
              uri: lb://REACTION-SERVICE
              predicates:
                - Path=/api/v1/story/**
            - id: story-reaction-service
              uri: lb://REACTION-SERVICE
              predicates:
                - Path=/api/v1/story-reactions/**
            - id: livestreams-reaction-service
              uri: lb://REACTION-SERVICE
              predicates:
                - Path=/api/v1/livestreams/**
            - id: ws-reaction-service
              uri: lb://REACTION-SERVICE
              predicates:
                - Path=/ws-reaction/**
            - id: story-collection-reaction-service
              uri: lb://REACTION-SERVICE
              predicates:
                - Path=/api/v1/story-collection/**
            - id: report-reaction-service
              uri: lb://REACTION-SERVICE
              predicates:
                - Path=/api/v1/reports/**
            - id: chatbot-reaction-service
              uri: lb://REACTION-SERVICE
              predicates:
                - Path=/api/v1/chatbot/**
            - id: recipe-service
              uri: lb://RECIPE-SERVICE
              predicates:
                - Path=/api/v1/nutrition/**
    bus:
      enabled: true
    stream:
      kafka:
        binder:
          brokers: ${env.global.kafka.bootstrap-servers:localhost:9092}
      bindings:
        springCloudBusInput:
          destination: springCloudBus
        springCloudBusOutput:
          destination: springCloudBus
logging:
  level:
    org.springframework.cloud.gateway: DEBUG

server:
  port: 8222

management:
  endpoints:
    web:
      exposure:
        include:
          - refresh       # Cho phép gọi /actuator/refresh để nạp lại cấu hình (dùng với Spring Cloud Config)
          - health        # Cho phép truy cập endpoint /actuator/health để kiểm tra tình trạng ứng dụng
          - info          # Cho phép truy cập /actuator/info để xem thông tin ứng dụng
          - metrics       # Cho phép truy cập /actuator/metrics để xem tất cả metric hiện có
          - prometheus    # Cho phép Prometheus scrape metrics tại /actuator/prometheus

  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  observations:
    key-values:
      application: gateway-service # Gắn nhãn `application=gateway-service` vào tất cả metric



